" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="685" dy="0">4-Stage</tspan><tspan x="685" dy="23.5">Signal Filter &amp; Bounds</tspan><tspan x="685" dy="23.5">Check?</tspan></text><rect x="35" y="310" width="250" height="100" rx="4" fill="#CFE2FF" stroke="#3B3F46" stroke-width="1.5"/><text x="160" y="343.7" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="160" dy="0">Discard Reading &amp;</tspan><tspan x="160" dy="22.1">Resample (Sensor Fault</tspan><tspan x="160" dy="22.1">if Invalid for 10 s)</tspan></text><rect x="520" y="508" width="330" height="84" rx="4" fill="#CFE2FF" stroke="#3B3F46" stroke-width="1.5"/><text x="685" y="544.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="685" dy="0">Convert to Height, Level %</tspan><tspan x="685" dy="23.5">&amp; pH (Calibration Values)</tspan></text><polygon points="685,650 875,735 685,820 495,735" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5" stroke-linejoin="round"/><text x="685" y="717.7" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="685" dy="0">Changed ≥ 2% or</tspan><tspan x="685" dy="23.5">≥ 0.15 pH, or 10 s</tspan><tspan x="685" dy="23.5">Heartbeat Due?</tspan></text><polygon points="685,880 835,950 685,1020 535,950" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5" stroke-linejoin="round"/><text x="685" y="944.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="685" dy="0">Primary</tspan><tspan x="685" dy="23.5">Ethernet Link Active?</tspan></text><rect x="940" y="900" width="290" height="100" rx="4" fill="#CFE2FF" stroke="#3B3F46" stroke-width="1.5"/><text x="1085" y="932.7" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" text-anch