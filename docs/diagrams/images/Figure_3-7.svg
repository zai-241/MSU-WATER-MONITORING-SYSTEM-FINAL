<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1478" viewBox="0 0 1200 1478"><rect width="1200" height="1478" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B3F46"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B3F46"/></marker></defs><rect x="8" y="8" width="376" height="1462.1599999999999" rx="20" fill="#CFE2FF" stroke="#3B3F46" stroke-width="2"/><text x="196" y="44.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Input</tspan></text><rect x="412" y="8" width="376" height="1462.1599999999999" rx="20" fill="#CFE2FF" stroke="#3B3F46" stroke-width="2"/><text x="600" y="44.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">Process</tspan></text><rect x="816" y="8" width="376" height="1462.1599999999999" rx="20" fill="#CFE2FF" stroke="#3B3F46" stroke-width="2"/><text x="1004" y="44.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">Output</tspan></text><rect x="18" y="62" width="356" height="215.76" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="196" y="133.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Hydrostatic Level Sensor</tspan></text><text x="196" y="168.1" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Analog voltage (0–3.3 V) through</tspan><tspan x="196" dy="26.4">the current-to-voltage module,</tspan><tspan x="196" dy="26.4">GPIO 35</tspan></text><rect x="422" y="62" width="356" height="215.76" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="600" y="94.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">Signal Processing &amp; Depth</tspan><tspan x="600" dy="26.9">Calculation</tspan></text><text x="600" y="155.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">Median and moving-average filters,</tspan><tspan x="600" dy="26.4">bounds and spike checks; height</tspan><tspan x="600" dy="26.4">and level % interpolated on the</tspan><tspan x="600" dy="26.4">calibration table of the tank</tspan><tspan x="600" dy="26.4">(Vmin/Vmax line without one)</tspan></text><rect x="826" y="62" width="356" height="215.76" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="1004" y="147.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">Calibrated Level &amp; Depth</tspan></text><text x="1004" y="181.3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">Level % and water height (m), with</tspan><tspan x="1004" dy="26.4">the level sensor health flag</tspan></text><line x1="374" y1="169.88" x2="402" y2="169.88" stroke="#3B3F46" stroke-width="7"/><polygon points="398,155.88 422,169.88 398,183.88" fill="#3B3F46"/><line x1="778" y1="169.88" x2="806" y2="169.88" stroke="#3B3F46" stroke-width="7"/><polygon points="802,155.88 826,169.88 802,183.88" fill="#3B3F46"/><rect x="18" y="287.76" width="356" height="109.68" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="196" y="333.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">pH Glass Electrode Sensor</tspan></text><text x="196" y="367.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Analog voltage (0–3.3 V), GPIO 34</tspan></text><rect x="422" y="287.76" width="356" height="109.68" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="600" y="319.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">pH Calibration &amp; Conversion</tspan></text><text x="600" y="354.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">Voltage check; neutral-voltage</tspan><tspan x="600" dy="26.4">slope formula + offset</tspan></text><rect x="826" y="287.76" width="356" height="109.68" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="1004" y="319.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">pH Reading</tspan></text><text x="1004" y="354.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">pH value (6.5–8.5 nominal), with</tspan><tspan x="1004" dy="26.4">the pH sensor health flag</tspan></text><line x1="374" y1="342.6" x2="402" y2="342.6" stroke="#3B3F46" stroke-width="7"/><polygon points="398,328.6 422,342.6 398,356.6" fill="#3B3F46"/><line x1="778" y1="342.6" x2="806" y2="342.6" stroke="#3B3F46" stroke-width="7"/><polygon points="802,328.6 826,342.6 802,356.6" fill="#3B3F46"/><rect x="18" y="407.44" width="356" height="136.07999999999998" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="196" y="452.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Invalid or Unstable Readings</tspan></text><text x="196" y="486.9" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Voltage out of range, or a level</tspan><tspan x="196" dy="26.4">swing of 25% or more within 30 s</tspan></text><rect x="422" y="407.44" width="356" height="136.07999999999998" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="600" y="439.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">Sensor Fault Check (10 s)</tspan></text><text x="600" y="473.7" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">Hold the last good value; after 10 s</tspan><tspan x="600" dy="26.4">flag the sensor faulty and keep</tspan><tspan x="600" dy="26.4">sending the clamped reading</tspan></text><rect x="826" y="407.44" width="356" height="136.07999999999998" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="1004" y="439.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">Monitoring Continues</tspan></text><text x="1004" y="473.7" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">Readings, history and alerts go on,</tspan><tspan x="1004" dy="26.4">marked as possibly inaccurate;</tspan><tspan x="1004" dy="26.4">pump held off on a level fault</tspan></text><line x1="374" y1="475.48" x2="402" y2="475.48" stroke="#3B3F46" stroke-width="7"/><polygon points="398,461.48 422,475.48 398,489.48" fill="#3B3F46"/><line x1="778" y1="475.48" x2="806" y2="475.48" stroke="#3B3F46" stroke-width="7"/><polygon points="802,461.48 826,475.48 802,489.48" fill="#3B3F46"/><rect x="18" y="553.52" width="356" height="136.07999999999998" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="196" y="598.7" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Telemetry Data Packets</tspan></text><text x="196" y="633.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Structured JSON on change (2% or</tspan><tspan x="196" dy="26.4">0.15 pH) or every 10 s</tspan></text><rect x="422" y="553.52" width="356" height="136.07999999999998" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="600" y="585.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">Transport &amp; RTDB Sync</tspan></text><text x="600" y="619.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">W5500 Ethernet + CPE210 P2P</tspan><tspan x="600" dy="26.4">bridge to Firebase; Wi-Fi failover</tspan><tspan x="600" dy="26.4">when Ethernet is down or slow</tspan></text><rect x="826" y="553.52" width="356" height="136.07999999999998" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="1004" y="585.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">Live Telemetry Sync</tspan></text><text x="1004" y="619.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">Real-time updates to the web</tspan><tspan x="1004" dy="26.4">dashboard &amp; mobile app; history</tspan><tspan x="1004" dy="26.4">every 10 min</tspan></text><line x1="374" y1="621.56" x2="402" y2="621.56" stroke="#3B3F46" stroke-width="7"/><polygon points="398,607.56 422,621.56 398,635.56" fill="#3B3F46"/><line x1="778" y1="621.56" x2="806" y2="621.56" stroke="#3B3F46" stroke-width="7"/><polygon points="802,607.56 826,621.56 802,635.56" fill="#3B3F46"/><rect x="18" y="699.5999999999999" width="356" height="215.76" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="196" y="758.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Level, Pump Commands &amp; Pump</tspan><tspan x="196" dy="26.9">Settings</tspan></text><text x="196" y="819.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Live level, thresholds, pumpOn</tspan><tspan x="196" dy="26.4">command, Pump System switch,</tspan><tspan x="196" dy="26.4">Auto / Manual mode</tspan></text><rect x="422" y="699.5999999999999" width="356" height="215.76" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="600" y="731.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">Local Pump Logic (GPIO 32</tspan><tspan x="600" dy="26.9">Relay)</tspan></text><text x="600" y="792.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">Auto start at the low threshold (30</tspan><tspan x="600" dy="26.4">s off time), stop at overflow; safety</tspan><tspan x="600" dy="26.4">stops; dry-run guard (3% rise in 10</tspan><tspan x="600" dy="26.4">min, 60 min max); each command</tspan><tspan x="600" dy="26.4">checked</tspan></text><rect x="826" y="699.5999999999999" width="356" height="215.76" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="1004" y="758.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">Refill Pump Control</tspan></text><text x="1004" y="792.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">Pump switched on the Pilot Test</tspan><tspan x="1004" dy="26.4">Tank; accepted or refused answer,</tspan><tspan x="1004" dy="26.4">pumpFault after a dry-run stop, and</tspan><tspan x="1004" dy="26.4">a log entry</tspan></text><line x1="374" y1="807.4799999999999" x2="402" y2="807.4799999999999" stroke="#3B3F46" stroke-width="7"/><polygon points="398,793.4799999999999 422,807.4799999999999 398,821.4799999999999" fill="#3B3F46"/><line x1="778" y1="807.4799999999999" x2="806" y2="807.4799999999999" stroke="#3B3F46" stroke-width="7"/><polygon points="802,793.4799999999999 826,807.4799999999999 802,821.4799999999999" fill="#3B3F46"/><rect x="18" y="925.3599999999999" width="356" height="189.36" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="196" y="970.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Alert Threshold &amp; Night Watch</tspan><tspan x="196" dy="26.9">Configuration</tspan></text><text x="196" y="1031.7" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Shared limits (default level</tspan><tspan x="196" dy="26.4">15%–95%, pH 6.5–8.5) or the tank's</tspan><tspan x="196" dy="26.4">own; night window 10 PM–3 AM</tspan></text><rect x="422" y="925.3599999999999" width="356" height="189.36" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="600" y="957.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">Alert State Machine &amp;</tspan><tspan x="600" dy="26.9">Validation</tspan></text><text x="600" y="1018.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">5-second persistence check;</tspan><tspan x="600" dy="26.4">repeat every 60 s until</tspan><tspan x="600" dy="26.4">acknowledged; night level-drop</tspan><tspan x="600" dy="26.4">check</tspan></text><rect x="826" y="925.3599999999999" width="356" height="189.36" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="1004" y="983.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">Real-Time In-App / Toast</tspan><tspan x="1004" dy="26.9">Alerts &amp; Logs</tspan></text><text x="1004" y="1044.9" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">In-app toast &amp; audible chime, push</tspan><tspan x="1004" dy="26.4">notifications, audit entries</tspan></text><line x1="374" y1="1020.04" x2="402" y2="1020.04" stroke="#3B3F46" stroke-width="7"/><polygon points="398,1006.04 422,1020.04 398,1034.04" fill="#3B3F46"/><line x1="778" y1="1020.04" x2="806" y2="1020.04" stroke="#3B3F46" stroke-width="7"/><polygon points="802,1006.04 826,1020.04 802,1034.04" fill="#3B3F46"/><rect x="18" y="1124.7199999999998" width="356" height="215.76" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="196" y="1156.7" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Admin Calibration &amp; System</tspan><tspan x="196" dy="26.9">Control</tspan></text><text x="196" y="1217.9" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Shared and per-tank thresholds,</tspan><tspan x="196" dy="26.4">calibration (multi-point level</tspan><tspan x="196" dy="26.4">table), maintenance mode (all</tspan><tspan x="196" dy="26.4">tanks or one tank), live calibration</tspan><tspan x="196" dy="26.4">view</tspan></text><rect x="422" y="1124.7199999999998" width="356" height="215.76" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="600" y="1196.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">RTDB Configuration Sync</tspan></text><text x="600" y="1230.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">Read by the ESP32 every second;</tspan><tspan x="600" dy="26.4">live readings sent once per second</tspan><tspan x="600" dy="26.4">while the view is open</tspan></text><rect x="826" y="1124.7199999999998" width="356" height="215.76" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="1004" y="1209.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">Updated System Behavior</tspan></text><text x="1004" y="1244.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">No re-flashing required; changes</tspan><tspan x="1004" dy="26.4">apply live</tspan></text><line x1="374" y1="1232.6" x2="402" y2="1232.6" stroke="#3B3F46" stroke-width="7"/><polygon points="398,1218.6 422,1232.6 398,1246.6" fill="#3B3F46"/><line x1="778" y1="1232.6" x2="806" y2="1232.6" stroke="#3B3F46" stroke-width="7"/><polygon points="802,1218.6 826,1232.6 802,1246.6" fill="#3B3F46"/><rect x="18" y="1350.4799999999998" width="356" height="109.68" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="196" y="1382.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">User Authentication &amp; Role Data</tspan></text><text x="196" y="1416.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">User credentials &amp; roles (Admin /</tspan><tspan x="196" dy="26.4">Worker / Viewer)</tspan></text><rect x="422" y="1350.4799999999998" width="356" height="109.68" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="600" y="1382.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">Firestore Auth &amp; Access Control</tspan></text><text x="600" y="1416.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">Firebase Auth validation &amp;</tspan><tspan x="600" dy="26.4">Role-Based Access Control (RBAC)</tspan></text><rect x="826" y="1350.4799999999998" width="356" height="109.68" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="1004" y="1382.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">Secured Client Dashboard</tspan></text><text x="1004" y="1416.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">React + Vite Web App &amp; Capacitor</tspan><tspan x="1004" dy="26.4">Android App</tspan></text><line x1="374" y1="1405.3199999999997" x2="402" y2="1405.3199999999997" stroke="#3B3F46" stroke-width="7"/><polygon points="398,1391.3199999999997 422,1405.3199999999997 398,1419.3199999999997" fill="#3B3F46"/><line x1="778" y1="1405.3199999999997" x2="806" y2="1405.3199999999997" stroke="#3B3F46" stroke-width="7"/><polygon points="802,1391.3199999999997 826,1405.3199999999997 802,1419.3199999999997" fill="#3B3F46"/></svg>