<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1346" viewBox="0 0 1200 1346"><rect width="1200" height="1346" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B3F46"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B3F46"/></marker></defs><rect x="8" y="8" width="376" height="1330.16" rx="20" fill="#CFE2FF" stroke="#3B3F46" stroke-width="2"/><text x="196" y="44.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Input</tspan></text><rect x="412" y="8" width="376" height="1330.16" rx="20" fill="#CFE2FF" stroke="#3B3F46" stroke-width="2"/><text x="600" y="44.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">Process</tspan></text><rect x="816" y="8" width="376" height="1330.16" rx="20" fill="#CFE2FF" stroke="#3B3F46" stroke-width="2"/><text x="1004" y="44.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">Output</tspan></text><rect x="18" y="62" width="356" height="189.36" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="196" y="120.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Hydrostatic Level Sensor</tspan></text><text x="196" y="154.9" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Analog voltage (0–3.3 V) through</tspan><tspan x="196" dy="26.4">the current-to-voltage module,</tspan><tspan x="196" dy="26.4">GPIO 35</tspan></text><rect x="422" y="62" width="356" height="189.36" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="600" y="94.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">Signal Processing &amp; Depth</tspan><tspan x="600" dy="26.9">Calculation</tspan></text><text x="600" y="155.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">Median and moving-average filters,</tspan><tspan x="600" dy="26.4">bounds and spike checks; height</tspan><tspan x="600" dy="26.4">and level % from Vmin, Vmax and</tspan><tspan x="600" dy="26.4">tank height</tspan></text><rect x="826" y="62" width="356" height="189.36" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="1004" y="133.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">Calibrated Level &amp; Depth</tspan></text><text x="1004" y="168.1" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">Level % and water height (m), with</tspan><tspan x="1004" dy="26.4">the level sensor health flag</tspan></text><line x1="374" y1="156.68" x2="402" y2="156.68" stroke="#3B3F46" stroke-width="7"/><polygon points="398,142.68 422,156.68 398,170.68" fill="#3B3F46"/><line x1="778" y1="156.68" x2="806" y2="156.68" stroke="#3B3F46" stroke-width="7"/><polygon points="802,142.68 826,156.68 802,170.68" fill="#3B3F46"/><rect x="18" y="261.36" width="356" height="109.68" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="196" y="306.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">pH Glass Electrode Sensor</tspan></text><text x="196" y="340.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Analog voltage (0–3.3 V), GPIO 34</tspan></text><rect x="422" y="261.36" width="356" height="109.68" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="600" y="293.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">pH Calibration &amp; Conversion</tspan></text><text x="600" y="327.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">Voltage check; neutral-voltage</tspan><tspan x="600" dy="26.4">slope formula + offset</tspan></text><rect x="826" y="261.36" width="356" height="109.68" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="1004" y="293.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">pH Reading</tspan></text><text x="1004" y="327.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">pH value (6.5–8.5 nominal), with</tspan><tspan x="1004" dy="26.4">the pH sensor health flag</tspan></text><line x1="374" y1="316.20000000000005" x2="402" y2="316.20000000000005" stroke="#3B3F46" stroke-width="7"/><polygon points="398,302.20000000000005 422,316.20000000000005 398,330.20000000000005" fill="#3B3F46"/><line x1="778" y1="316.20000000000005" x2="806" y2="316.20000000000005" stroke="#3B3F46" stroke-width="7"/><polygon points="802,302.20000000000005 826,316.20000000000005 802,330.20000000000005" fill="#3B3F46"/><rect x="18" y="381.04" width="356" height="136.07999999999998" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="196" y="426.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Invalid or Unstable Readings</tspan></text><text x="196" y="460.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Voltage out of range, or a level</tspan><tspan x="196" dy="26.4">swing of 25% or more within 30 s</tspan></text><rect x="422" y="381.04" width="356" height="136.07999999999998" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="600" y="413.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">Sensor Fault Check (10 s)</tspan></text><text x="600" y="447.3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">Hold the last good value; after 10 s</tspan><tspan x="600" dy="26.4">flag the sensor faulty and keep</tspan><tspan x="600" dy="26.4">sending the clamped reading</tspan></text><rect x="826" y="381.04" width="356" height="136.07999999999998" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="1004" y="413.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">Monitoring Continues</tspan></text><text x="1004" y="447.3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">Readings, history and alerts go on,</tspan><tspan x="1004" dy="26.4">marked as possibly inaccurate;</tspan><tspan x="1004" dy="26.4">pump held off on a level fault</tspan></text><line x1="374" y1="449.08000000000004" x2="402" y2="449.08000000000004" stroke="#3B3F46" stroke-width="7"/><polygon points="398,435.08000000000004 422,449.08000000000004 398,463.08000000000004" fill="#3B3F46"/><line x1="778" y1="449.08000000000004" x2="806" y2="449.08000000000004" stroke="#3B3F46" stroke-width="7"/><polygon points="802,435.08000000000004 826,449.08000000000004 802,463.08000000000004" fill="#3B3F46"/><rect x="18" y="527.12" width="356" height="136.07999999999998" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="196" y="572.3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Telemetry Data Packets</tspan></text><text x="196" y="606.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Structured JSON on change (2% or</tspan><tspan x="196" dy="26.4">0.15 pH) or every 10 s</tspan></text><rect x="422" y="527.12" width="356" height="136.07999999999998" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="600" y="559.1" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">Transport &amp; RTDB Sync</tspan></text><text x="600" y="593.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">W5500 Ethernet + CPE210 P2P</tspan><tspan x="600" dy="26.4">bridge to Firebase; Wi-Fi failover</tspan><tspan x="600" dy="26.4">when Ethernet is down or slow</tspan></text><rect x="826" y="527.12" width="356" height="136.07999999999998" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="1004" y="559.1" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">Live Telemetry Sync</tspan></text><text x="1004" y="593.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">Real-time updates to the web</tspan><tspan x="1004" dy="26.4">dashboard &amp; mobile app; history</tspan><tspan x="1004" dy="26.4">every 10 min</tspan></text><line x1="374" y1="595.16" x2="402" y2="595.16" stroke="#3B3F46" stroke-width="7"/><polygon points="398,581.16 422,595.16 398,609.16" fill="#3B3F46"/><line x1="778" y1="595.16" x2="806" y2="595.16" stroke="#3B3F46" stroke-width="7"/><polygon points="802,581.16 826,595.16 802,609.16" fill="#3B3F46"/><rect x="18" y="673.2" width="356" height="162.96" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="196" y="705.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Level, Pump Commands &amp; Pump</tspan><tspan x="196" dy="26.9">Settings</tspan></text><text x="196" y="766.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Live level, thresholds, pumpOn</tspan><tspan x="196" dy="26.4">command, Pump System switch,</tspan><tspan x="196" dy="26.4">Auto / Manual mode</tspan></text><rect x="422" y="673.2" width="356" height="162.96" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="600" y="705.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">Local Pump Logic (GPIO 32</tspan><tspan x="600" dy="26.9">Relay)</tspan></text><text x="600" y="766.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">Auto start at the low threshold (30</tspan><tspan x="600" dy="26.4">s off time), stop at overflow; safety</tspan><tspan x="600" dy="26.4">stops; each command checked</tspan></text><rect x="826" y="673.2" width="356" height="162.96" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="1004" y="718.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">Refill Pump Control</tspan></text><text x="1004" y="752.9" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">Pump switched on the drum model;</tspan><tspan x="1004" dy="26.4">accepted or refused answer and a</tspan><tspan x="1004" dy="26.4">log entry</tspan></text><line x1="374" y1="754.6800000000001" x2="402" y2="754.6800000000001" stroke="#3B3F46" stroke-width="7"/><polygon points="398,740.6800000000001 422,754.6800000000001 398,768.6800000000001" fill="#3B3F46"/><line x1="778" y1="754.6800000000001" x2="806" y2="754.6800000000001" stroke="#3B3F46" stroke-width="7"/><polygon points="802,740.6800000000001 826,754.6800000000001 802,768.6800000000001" fill="#3B3F46"/><rect x="18" y="846.1600000000001" width="356" height="189.36" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="196" y="891.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Alert Threshold &amp; Night Watch</tspan><tspan x="196" dy="26.9">Configuration</tspan></text><text x="196" y="952.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Water level (15%–95%), pH</tspan><tspan x="196" dy="26.4">(6.5–8.5); night window 10 PM–3</tspan><tspan x="196" dy="26.4">AM</tspan></text><rect x="422" y="846.1600000000001" width="356" height="189.36" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="600" y="878.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">Alert State Machine &amp;</tspan><tspan x="600" dy="26.9">Validation</tspan></text><text x="600" y="939.3" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">5-second persistence check;</tspan><tspan x="600" dy="26.4">repeat every 60 s until</tspan><tspan x="600" dy="26.4">acknowledged; night level-drop</tspan><tspan x="600" dy="26.4">check</tspan></text><rect x="826" y="846.1600000000001" width="356" height="189.36" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="1004" y="904.6" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">Real-Time In-App / Toast</tspan><tspan x="1004" dy="26.9">Alerts &amp; Logs</tspan></text><text x="1004" y="965.7" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">In-app toast &amp; audible chime, push</tspan><tspan x="1004" dy="26.4">notifications, audit entries</tspan></text><line x1="374" y1="940.8400000000001" x2="402" y2="940.8400000000001" stroke="#3B3F46" stroke-width="7"/><polygon points="398,926.8400000000001 422,940.8400000000001 398,954.8400000000001" fill="#3B3F46"/><line x1="778" y1="940.8400000000001" x2="806" y2="940.8400000000001" stroke="#3B3F46" stroke-width="7"/><polygon points="802,926.8400000000001 826,940.8400000000001 802,954.8400000000001" fill="#3B3F46"/><rect x="18" y="1045.52" width="356" height="162.96" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="196" y="1077.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Admin Calibration &amp; System</tspan><tspan x="196" dy="26.9">Control</tspan></text><text x="196" y="1138.7" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">Thresholds, calibration,</tspan><tspan x="196" dy="26.4">maintenance mode, live calibration</tspan><tspan x="196" dy="26.4">view</tspan></text><rect x="422" y="1045.52" width="356" height="162.96" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="600" y="1091.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">RTDB Configuration Sync</tspan></text><text x="600" y="1125.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">Read by the ESP32 every second;</tspan><tspan x="600" dy="26.4">live readings sent once per second</tspan><tspan x="600" dy="26.4">while the view is open</tspan></text><rect x="826" y="1045.52" width="356" height="162.96" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="1004" y="1104.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">Updated System Behavior</tspan></text><text x="1004" y="1138.4" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">No re-flashing required; changes</tspan><tspan x="1004" dy="26.4">apply live</tspan></text><line x1="374" y1="1127" x2="402" y2="1127" stroke="#3B3F46" stroke-width="7"/><polygon points="398,1113 422,1127 398,1141" fill="#3B3F46"/><line x1="778" y1="1127" x2="806" y2="1127" stroke="#3B3F46" stroke-width="7"/><polygon points="802,1113 826,1127 802,1141" fill="#3B3F46"/><rect x="18" y="1218.48" width="356" height="109.68" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="196" y="1250.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">User Authentication &amp; Role Data</tspan></text><text x="196" y="1284.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="196" dy="0">User credentials &amp; roles (Admin /</tspan><tspan x="196" dy="26.4">Worker / Viewer)</tspan></text><rect x="422" y="1218.48" width="356" height="109.68" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="600" y="1250.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">Firestore Auth &amp; Access Control</tspan></text><text x="600" y="1284.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="600" dy="0">Firebase Auth validation &amp;</tspan><tspan x="600" dy="26.4">Role-Based Access Control (RBAC)</tspan></text><rect x="826" y="1218.48" width="356" height="109.68" rx="6" fill="#C3F5C3" stroke="#3B3F46" stroke-width="1.5"/><text x="1004" y="1250.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">Secured Client Dashboard</tspan></text><text x="1004" y="1284.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#111111"><tspan x="1004" dy="0">React + Vite Web App &amp; Capacitor</tspan><tspan x="1004" dy="26.4">Android App</tspan></text><line x1="374" y1="1273.32" x2="402" y2="1273.32" stroke="#3B3F46" stroke-width="7"/><polygon points="398,1259.32 422,1273.32 398,1287.32" fill="#3B3F46"/><line x1="778" y1="1273.32" x2="806" y2="1273.32" stroke="#3B3F46" stroke-width="7"/><polygon points="802,1259.32 826,1273.32 802,1287.32" fill="#3B3F46"/></svg>